    <!-- Main shopping cart section -->
    <main class="cart-page">

        <h2>Your Shopping Cart</h2>

        <p id="cart-message" class="cart-message" role="status"></p>

        <!-- Message displayed when the cart is empty -->

            Your shopping cart is empty.
            Please visit our shop to choose your favourite nail designs.
        </p>

        <div id="cart-items"></div>
        <h3>
            Total:
            <span id="cart-total">R0.00</span>
        </h3>

        </a>

        <a href="check out.html" id="checkout-button" class="shop-button">

    <!-- Product list  cart/stock logic -->
    <script src="store.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/js/lightbox.min.js"></script>
<!-- https://github.com/kasuboski/client-side-cart-example/blob/main/index.html
     Josh Kasuboski-->

    <script>
        var messageEl = document.getElementById("cart-message");
        var emptyEl = document.getElementById("cart-empty");
        var itemsEl = document.getElementById("cart-items");
        var totalEl = document.getElementById("cart-total");
        var checkoutBtn = document.getElementById("checkout-button");
        function money(n) { return "R" + n.toFixed(2); }

        // click on the photo and go to the  cart.html
        (function handleAdd() {
            var id = new URLSearchParams(window.location.search).get("add");
            if (!id) return;
            var p = getProduct(id);
            if (p) {
                var result = addToCart(p.id);
                if (result === "added") messageEl.textContent = p.name + " was added to your cart.";
                if (result === "max") messageEl.textContent = "You already have all " + p.stock + " available units of " + p.name + " in your cart.";
                if (result === "soldout") messageEl.textContent = p.name + " is sold out.";
            }
    
            history.replaceState(null, "", "cart.html");
        })();
        //Draws the cart items on the  shop page
        function render() {
            var cart = getCart();
            var ids = Object.keys(cart).filter(function (id) { return getProduct(id); });
            itemsEl.innerHTML = "";

            if (ids.length === 0) {
                emptyEl.hidden = false;
                checkoutBtn.style.display = "none";
                totalEl.textContent = money(0);
                return;
            }
            emptyEl.hidden = true;
            checkoutBtn.style.display = "";

            ids.forEach(function (id) {
                var p = getProduct(id);
                var qty = cart[id];
                var left = unitsLeft(id);

                var row = document.createElement("div");
                row.className = "cart-row";
                row.innerHTML =
                    '<a class="cart-image-link" href="' + p.image + '" data-lightbox="cart-products" data-title="' + p.name + '">' +
                        '<img src="' + p.image + '" alt="' + p.name + '" width="120" height="150">' +
                    '</a>' +
                    '<div class="cart-info">' +
                        '<h3>' + p.name + '</h3>' +
                        '<p>' + p.desc + '</p>' +
                        '<p>Price: ' + money(p.price) + '</p>' +
                        '<p class="units-left"><strong>' + left + '</strong> unit' + (left === 1 ? '' : 's') + ' left in stock' +
                            (left === 0 ? ' (you have them all in your cart)' : '') + '</p>' +
                        '<div class="qty">' +
                            '<button type="button" data-act="minus" data-id="' + id + '" aria-label="Decrease quantity">&minus;</button>' +
                            '<span>' + qty + '</span>' +
                            '<button type="button" data-act="plus" data-id="' + id + '" aria-label="Increase quantity"' + (left <= 0 ? ' disabled' : '') + '>+</button>' +
                            '<button type="button" class="remove" data-act="remove" data-id="' + id + '">Remove</button>' +
                        '</div>' +
                    '</div>' +
                    '<p class="line-total">' + money(p.price * qty) + '</p>';
                itemsEl.appendChild(row);
            });

            totalEl.textContent = money(cartTotal());
        }

        itemsEl.addEventListener("click", function (e) {
            var btn = e.target.closest("button[data-act]");
            if (!btn) return;
            var id = btn.dataset.id, cart = getCart();
            if (btn.dataset.act === "plus") setQuantity(id, (cart[id] || 0) + 1);
            if (btn.dataset.act === "minus") setQuantity(id, (cart[id] || 0) - 1);
            if (btn.dataset.act === "remove") removeFromCart(id);
            messageEl.textContent = "";
            render();
        });

        render();
    </script>
